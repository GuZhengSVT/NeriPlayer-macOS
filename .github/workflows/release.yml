# M9-T5: tag-triggered release build. Signing and notarization are optional.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # 必须显式选 Xcode：macos-15 runner 的默认 Xcode 是 16.4（Swift 6.1.2），
      # 它的 -O 优化器在本工程上有编译器缺陷 —— 优化 HTTPAudioDownloader.download 时
      # NonTransparentFunctionOwnershipModelEliminator 触发 SIL ownership 校验崩溃
      # （signal 6，报 Optional<TransferCheckpoint> 的 load_borrow 缺失 enclosing values）。
      # debug 构建不触发，因此只有 release 打包会挂。镜像里装有 Xcode 26.x，
      # 其 Swift 已修掉该缺陷，故固定到 26.3 并显式 DEVELOPER_DIR。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          # 固定路径可能随 runner 镜像更新而消失；先显式校验，避免退化成难懂的编译错误。
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "找不到 $DEVELOPER_DIR；runner 镜像可能已更新，请改用镜像中实际存在的 Xcode。" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sw_vers
          swift --version
          xcodebuild -version
      - name: Vendor libmpv
        run: Tools/fetch-mpv.sh
      # VERSION 必须从 tag 推导：package.sh 的默认值是仓库当前的开发版本号，
      # 不传就会让 v0.1.0 的标签产出仍自称 0.0.9 的 .app（Info.plist 与「关于」页都错）。
      # tag 形如 v0.1.0，去掉前导 v 即 SemVer 版本。
      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag 不是 vX.Y.Z 形式：$GITHUB_REF_NAME" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version"
      - name: Package app and DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE || '' }}
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: Tools/package.sh
      # 打包完成后回读 Info.plist，把「版本号没跟上 tag」这类错误挡在发布之前。
      - name: Verify packaged version matches tag
        env:
          EXPECTED: ${{ steps.version.outputs.value }}
        run: |
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/NeriPlayer.app/Contents/Info.plist)"
          echo "Info.plist CFBundleShortVersionString=$actual (expected $EXPECTED)"
          [[ "$actual" == "$EXPECTED" ]] || { echo "打包产物版本与 tag 不一致" >&2; exit 1; }
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeriPlayer-${{ github.ref_name }}
          path: dist/*.dmg
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --draft --title "NeriPlayer $GITHUB_REF_NAME" \
            --generate-notes
